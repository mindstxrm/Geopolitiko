name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff (platform modules)
        run: |
          ruff check app/db.py app/authz.py app/audit.py app/security.py app/sentry_init.py \
            tests/test_p4_platform.py scripts/migrate_sqlite_to_postgres.py
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          ANALYST_DESK_SECRET_KEY: ci-test-desk-secret
          ANALYST_DESK_PUBLISH_ON_APPROVE: "1"
          GEOPOLITIKO_DISABLE_CSRF: "1"
        run: pytest -q
